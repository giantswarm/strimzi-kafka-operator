apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: "4.2-IV1"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      auto.create.topics.enable: "false"
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
    # Broker-internal metrics (request rates, under-replicated partitions, JVM, ...).
    # These do NOT include consumer group lag — that is what Kafka Exporter adds below.
    metricsConfig:
      type: strimziMetricsReporter
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Kafka Exporter — deployed by the operator as a separate `my-cluster-kafka-exporter`
  # pod. It connects to Kafka as a client and exposes offset-derived metrics that the
  # broker cannot report itself, most importantly per-consumer-group lag
  # (kafka_consumergroup_lag / _sum) and per-topic/partition offsets.
  #
  # The pod is labelled `strimzi.io/kind: Kafka` and serves metrics on the standard
  # `tcp-prometheus` port (9404), so the same PodMonitor that scrapes the brokers also
  # scrapes the exporter — no extra scrape config needed.
  kafkaExporter:
    # Which topics / consumer groups to report on. ".*" covers everything, which is fine
    # for a demo cluster. On large clusters narrow these (or use topicExcludeRegex /
    # groupExcludeRegex): a broad regex queries every partition and group on every scrape,
    # raising exporter CPU, broker load, and Prometheus cardinality.
    topicRegex: ".*"
    groupRegex: ".*"

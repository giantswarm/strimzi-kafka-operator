name: Trigger E2E on Release PR
on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  trigger:
    if: >-
      (github.event.pull_request.user.login == 'taylorbot' || github.event.pull_request.user.login == 'giantswarm-release[bot]') &&
      startsWith(github.event.pull_request.title, 'chore(release): v')
    runs-on: ubuntu-latest
    steps:
      # Tekton's pr-comment-filter rejects /run comments from Bot users other than
      # allow-listed ones, so the comment is posted as giantswarm-release[bot].
      - name: Generate giantswarm-release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-pull-requests: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '/run app-test-suites'
            })

name: Test chart

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'Makefile.custom.mk'
      - '.github/workflows/test-chart.yaml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: make test-chart

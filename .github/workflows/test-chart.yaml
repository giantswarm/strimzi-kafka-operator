name: Test chart

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'Makefile.custom.mk'
      - '.github/workflows/test-chart.yaml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: make test-chart

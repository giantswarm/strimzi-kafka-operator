name: Test chart

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'Makefile.custom.mk'
      - '.github/workflows/test-chart.yaml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
      - run: make test-chart

name: Test chart

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'Makefile.custom.mk'
      - '.github/workflows/test-chart.yaml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - run: make test-chart
